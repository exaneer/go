<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXA Dreamwalk</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1630;color:#f6e7c8;font-family:Georgia,serif}</style>
</head><body><p>🏮</p>
<script>
// 꿈길 바로가기 (본진 11-06): 클릭을 세고 꿈길로 보낸다. ?s=<출처> ?l=<꿈길 화면 언어>
(function(){
  var q=new URLSearchParams(location.search), s=(q.get('s')||'direct').replace(/[^a-z0-9_-]/gi,'').slice(0,30);
  var l=(q.get('l')||'').replace(/[^a-zA-Z-]/g,'').slice(0,5);
  var url='https://dream-forest.dream-forest.workers.dev/?'+(l?'lang='+l+'&':'')+'utm_source='+s+'&utm_medium=social&utm_campaign=dreamwalk';
  var dev=/iPhone|iPad|iPod/i.test(navigator.userAgent)?'ios':/Android/i.test(navigator.userAgent)?'android':'other';
  var hit='https://exa-go-counter.exa-marketing.workers.dev/hit?l=dw&s='+s+'&d='+dev;
  function go(){ location.replace(url); }
  try{ if(navigator.sendBeacon && navigator.sendBeacon(hit)) { setTimeout(go,120); return; } }catch(e){}
  try{ fetch(hit,{mode:'no-cors',keepalive:true}); }catch(e){}
  setTimeout(go,250);
})();
</script></body></html>
