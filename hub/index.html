<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXA</title><meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3a2f5c,#120e22);color:#f6e7c8;font-family:system-ui,-apple-system,sans-serif}
main{display:grid;gap:14px;padding:24px 16px;text-align:center;max-width:360px;width:100%}
h1{font-family:Georgia,serif;font-weight:400;letter-spacing:4px;margin:0 0 6px}
a{display:block;padding:16px;border-radius:14px;text-decoration:none;font-weight:700}
.dw{background:#f3c98b;color:#2a1d3a}.app{background:#f4efe6;color:#18362b}
small{display:block;font-weight:400;opacity:.75;margin-top:4px}
</style></head><body><main>
<h1>EXA</h1>
<a class="dw" id="dw" href="../dw/">🏮 Dreamwalk<small id="dws">Release a wish lantern for someone · free, in your browser</small></a>
<a class="app" id="app" href="../ko/">📱 EXA Languages<small id="apps">Learn Korean · first 14 lessons free</small></a>
</main>
<script>
// 프로필(바이오) 링크 하나에 꿈길·앱 두 갈래 (본진 11-06). ?s=<출처> ?l=<언어: en|ja|es> ?app=<go 언어 폴더>
(function(){
  var q=new URLSearchParams(location.search), s=(q.get('s')||'bio').replace(/[^a-z0-9_-]/gi,'').slice(0,30);
  var l=(q.get('l')||'en').replace(/[^a-z-]/g,''), app=(q.get('app')||'ko').replace(/[^a-z]/g,'');
  var T={en:['Release a wish lantern for someone · free, in your browser','Learn Korean · first 14 lessons free'],
         ja:['大切な人にランタンを送ろう・無料・ブラウザですぐ','韓国語を学ぶ・14レッスンまで無料'],
         es:['Mándale un farolito a quien extrañas · gratis, en tu navegador','Aprende coreano · primeras 14 lecciones gratis']}[l]||null;
  if(T){document.getElementById('dws').textContent=T[0];document.getElementById('apps').textContent=T[1];}
  document.getElementById('dw').href='../dw/?s='+s+'-dw&l='+l;
  document.getElementById('app').href='../'+app+'/?s='+s;
})();
</script></body></html>
