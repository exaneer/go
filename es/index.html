<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn Spanish · EXA Languages</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#18362b;--fg:#f4efe6;--btn:#f4efe6;--btnfg:#18362b}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{display:grid;gap:14px;padding:24px 16px;text-align:center;max-width:360px;width:100%}
h1{font-size:1.4rem;margin:0} p{margin:0;opacity:.8}
a{display:block;padding:14px;border-radius:12px;background:var(--btn);color:var(--btnfg);text-decoration:none;font-weight:700}
</style></head><body><main>
<h1>EXA Languages</h1><p>Learn Spanish with original K-dramas · 14-day free trial</p>
<a id="ios" href="https://apps.apple.com/app/id6793985973?ppid=d118a498-cab0-4ee2-bec5-20ed7e405390">App Store</a><a id="and" href="https://play.google.com/store/apps/details?id=com.exaneer.exalanguages&listing=learn-spanish">Google Play</a>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), s=(q.get('s')||'direct').replace(/[^a-z0-9_-]/gi,'').slice(0,30);
  var ref=encodeURIComponent('utm_source='+s+'&utm_medium=social&utm_campaign=learn-es');
  var play='https://play.google.com/store/apps/details?id=com.exaneer.exalanguages&listing=learn-spanish'+'&referrer='+ref;
  document.getElementById('and').href=play;
  var ios='https://apps.apple.com/app/id6793985973?ppid=d118a498-cab0-4ee2-bec5-20ed7e405390', pt='129126122';
  if(pt) ios+=(ios.indexOf('?')<0?'?':'&')+'pt='+pt+'&ct='+encodeURIComponent('es-'+s)+'&mt=8';
  document.getElementById('ios').href=ios;
  var ua=navigator.userAgent||'', dev=/iPhone|iPad|iPod/i.test(ua)?'ios':/Android/i.test(ua)?'android':'other';
  var counter='https://exa-go-counter.exa-marketing.workers.dev';
  function go(){ if(dev==='ios') location.replace(ios); else if(dev==='android') location.replace(play); }
  if(counter){
    var hit=counter+'/hit?l=es&s='+s+'&d='+dev;
    try{ if(navigator.sendBeacon && navigator.sendBeacon(hit)) { setTimeout(go,150); return; } }catch(e){}
    try{ fetch(hit,{mode:'no-cors',keepalive:true}); }catch(e){}
    setTimeout(go,300);
  } else go();
})();
</script></body></html>
